openapi: 3.0.3
info:
  title: 'DOMPET Backend API API Documentation'
  description: 'Dokumentasi endpoint API untuk backend Zaku.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8001'
tags:
  -
    name: Authentication
    description: ''
  -
    name: API
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Dapatkan token dari endpoint <code>POST /api/auth/login</code>, lalu kirim sebagai Bearer token.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Register user'
      operationId: registerUser
      description: 'Membuat user baru, ledger internal, kode verifikasi email, dan JWT token.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'User registered successfully'
                  data:
                    user:
                      id: 1
                      full_name: 'John Doe'
                      email: user@example.com
                      avatar_initial: J
                    token: jwt_token_here
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'User registered successfully'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          full_name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: user@example.com
                          avatar_initial:
                            type: string
                            example: J
                      token:
                        type: string
                        example: jwt_token_here
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email user.'
                  example: user@example.com
                password:
                  type: string
                  description: 'Minimal 8 karakter.'
                  example: password123
                name:
                  type: string
                  description: 'This field is required when <code>full_name</code> is not present. Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                full_name:
                  type: string
                  description: 'Nama lengkap user.'
                  example: 'John Doe'
                phone_number:
                  type: string
                  description: 'Nomor telepon opsional.'
                  example: '08123456789'
                  nullable: true
              required:
                - email
                - password
                - full_name
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Login user'
      operationId: loginUser
      description: 'Mengautentikasi user yang email-nya sudah diverifikasi dan mengembalikan JWT token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'Login successful'
                  data:
                    token: jwt_token_here
                    user:
                      id: 1
                      full_name: 'John Doe'
                      email: user@example.com
                      is_verified: true
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'Login successful'
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: jwt_token_here
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          full_name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: user@example.com
                          is_verified:
                            type: boolean
                            example: true
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: error
                  message: 'Invalid credentials.'
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: 'Invalid credentials.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: error
                  message: 'Email address is not verified.'
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: 'Email address is not verified.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email user.'
                  example: user@example.com
                password:
                  type: string
                  description: 'Password user.'
                  example: password123
              required:
                - email
                - password
      security: []
  /api/v1/auth/verify-email:
    post:
      summary: 'Verify email'
      operationId: verifyEmail
      description: 'Memvalidasi kode verifikasi dan menandai email user sebagai terverifikasi.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'Email verified successfully'
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'Email verified successfully'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: error
                  message: 'Verification code has expired.'
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: 'Verification code has expired.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email user yang akan diverifikasi. Must be a valid email address.'
                  example: user@example.com
                code:
                  type: string
                  description: 'Kode verifikasi 6 digit dari email/log.'
                  example: '123456'
                user_id:
                  type: integer
                  description: 'ID user yang akan diverifikasi.'
                  example: 1
              required:
                - email
                - code
                - user_id
      security: []
  /api/v1/auth/resend-verification:
    post:
      summary: 'Resend verification code'
      operationId: resendVerificationCode
      description: 'Mengirim ulang kode verifikasi untuk user yang belum terverifikasi.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'Verification code sent to your email'
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'Verification code sent to your email'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email user.'
                  example: user@example.com
              required:
                - email
      security: []
  /api/v1/auth/forgot-password:
    post:
      summary: 'Forgot password'
      operationId: forgotPassword
      description: 'Membuat token reset password dan mengirimkannya ke email user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'Password reset link sent to your email'
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'Password reset link sent to your email'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email user.'
                  example: user@example.com
              required:
                - email
      security: []
  /api/v1/auth/change-password:
    post:
      summary: 'Change password'
      operationId: changePassword
      description: 'Mengubah password user yang sedang login. Endpoint ini membutuhkan JWT Bearer token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'Password changed successfully'
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'Password changed successfully'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: error
                  message: 'Authorization token is required.'
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: 'Authorization token is required.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                  description: 'Password lama.'
                  example: password123
                new_password:
                  type: string
                  description: 'Password baru minimal 8 karakter.'
                  example: password456
                new_password_confirmation:
                  type: string
                  description: 'Konfirmasi password baru.'
                  example: password456
              required:
                - old_password
                - new_password
                - new_password_confirmation
  /api/v1/auth/me:
    get:
      summary: 'Get authenticated user profile'
      operationId: getAuthenticatedUserProfile
      description: 'Mengambil data profil user yang sedang login.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    id: 1
                    name: 'John Doe'
                    email: user@example.com
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: user@example.com
      tags:
        - Authentication
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh JWT token (token rotation via blacklist)'
      operationId: refreshJWTTokentokenRotationViaBlacklist
      description: "Menginvalidasi token lama (blacklist) dan mengembalikan token baru.\nAccess token TTL = JWT_TTL (default 1440 menit)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  data:
                    access_token: jwt_token_here
                    refresh_token: jwt_token_here
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: jwt_token_here
                      refresh_token:
                        type: string
                        example: jwt_token_here
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      summary: 'Logout user'
      operationId: logoutUser
      description: 'Menginvalidasi token JWT yang sedang digunakan.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: 'Successfully logged out'
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 'Successfully logged out'
      tags:
        - Authentication
  /api/v1/health:
    get:
      summary: ''
      operationId: getApiV1Health
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
                  timestamp: '2026-07-02T03:53:33+00:00'
                  app: 'DOMPET Backend API'
                  version: 1.0.0
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    example: '2026-07-02T03:53:33+00:00'
                  app:
                    type: string
                    example: 'DOMPET Backend API'
                  version:
                    type: string
                    example: 1.0.0
      tags:
        - API
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: ''
      operationId: postApiV1AuthResetPassword
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email user yang meminta reset password. Must be a valid email address.'
                  example: user@example.com
                token:
                  type: string
                  description: 'Token reset password dari email atau log.'
                  example: reset-token
                password:
                  type: string
                  description: 'Password baru minimal 8 karakter. Must be at least 8 characters.'
                  example: password123
              required:
                - email
                - token
                - password
      security: []
  /api/v1/user/profile:
    get:
      summary: ''
      operationId: getApiV1UserProfile
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token not provided'
                properties:
                  message:
                    type: string
                    example: 'Token not provided'
      tags:
        - API
      security: []
    put:
      summary: ''
      operationId: putApiV1UserProfile
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nama lengkap user. Must not be greater than 255 characters.'
                  example: 'Budi Santoso'
                email:
                  type: string
                  description: 'Email unik user. Must be a valid email address. Must not be greater than 255 characters.'
                  example: budi@example.com
              required:
                - name
                - email
      security: []
  /api/v1/user/budget:
    put:
      summary: ''
      operationId: putApiV1UserBudget
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                monthly_budget:
                  type: integer
                  description: 'Budget bulanan dalam integer IDR. Must be at least 0.'
                  example: 3000000
              required:
                - monthly_budget
      security: []
  /api/v1/dashboard:
    get:
      summary: ''
      operationId: getApiV1Dashboard
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token not provided'
                properties:
                  message:
                    type: string
                    example: 'Token not provided'
      tags:
        - API
      security: []
  /api/v1/transactions:
    get:
      summary: ''
      operationId: getApiV1Transactions
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token not provided'
                properties:
                  message:
                    type: string
                    example: 'Token not provided'
      tags:
        - API
      security: []
    post:
      summary: ''
      operationId: postApiV1Transactions
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: 'Jenis transaksi.'
                  example: expense
                  enum:
                    - income
                    - expense
                amount:
                  type: integer
                  description: 'Nominal transaksi.'
                  example: 65000
                description:
                  type: string
                  description: 'Deskripsi transaksi. Must not be greater than 1000 characters.'
                  example: 'Beli kopi'
                category:
                  type: string
                  description: 'Nama kategori transaksi. The <code>name</code> of an existing record in the categories table.'
                  example: MAKANAN
                transaction_date:
                  type: string
                  description: 'Tanggal transaksi. Must be a valid date.'
                  example: '2026-05-20'
              required:
                - type
                - amount
                - description
                - category
      security: []
  /api/v1/insights:
    get:
      summary: ''
      operationId: getApiV1Insights
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token not provided'
                properties:
                  message:
                    type: string
                    example: 'Token not provided'
      tags:
        - API
      security: []
  '/api/v1/transactions/{id}':
    put:
      summary: ''
      operationId: putApiV1TransactionsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: 'Jenis transaksi.'
                  example: expense
                  enum:
                    - income
                    - expense
                amount:
                  type: integer
                  description: 'Nominal transaksi.'
                  example: 50000
                description:
                  type: string
                  description: 'Deskripsi transaksi. Must not be greater than 1000 characters.'
                  example: 'Makan siang'
                category:
                  type: string
                  description: 'Nama kategori transaksi. The <code>name</code> of an existing record in the categories table.'
                  example: MAKANAN
                transaction_date:
                  type: string
                  description: 'Tanggal transaksi. Must be a valid date.'
                  example: '2026-06-01'
      security: []
    get:
      summary: ''
      operationId: getApiV1TransactionsId
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token not provided'
                properties:
                  message:
                    type: string
                    example: 'Token not provided'
      tags:
        - API
      security: []
    delete:
      summary: ''
      operationId: deleteApiV1TransactionsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the transaction.'
        example: consequatur
        required: true
        schema:
          type: string
  /api/v1/transactions/stats:
    get:
      summary: ''
      operationId: getApiV1TransactionsStats
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token not provided'
                properties:
                  message:
                    type: string
                    example: 'Token not provided'
      tags:
        - API
      security: []
  /api/v1/transactions/categories:
    get:
      summary: ''
      operationId: getApiV1TransactionsCategories
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token not provided'
                properties:
                  message:
                    type: string
                    example: 'Token not provided'
      tags:
        - API
      security: []
  /api/v1/ai/chat:
    post:
      summary: ''
      operationId: postApiV1AiChat
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Input teks natural language untuk dicatat sebagai transaksi. Must be at least 3 characters. Must not be greater than 500 characters.'
                  example: 'Beli kopi di Starbucks 65 ribu'
              required:
                - message
      security: []
  /api/v1/transactions/chat:
    post:
      summary: ''
      operationId: postApiV1TransactionsChat
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Input teks natural language untuk dicatat sebagai transaksi. Must be at least 3 characters. Must not be greater than 500 characters.'
                  example: 'Beli kopi di Starbucks 65 ribu'
              required:
                - message
      security: []
  /api/v1/recurring-transactions:
    get:
      summary: ''
      operationId: getApiV1RecurringTransactions
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token not provided'
                properties:
                  message:
                    type: string
                    example: 'Token not provided'
      tags:
        - API
      security: []
    post:
      summary: ''
      operationId: postApiV1RecurringTransactions
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: ''
                  example: expense
                  enum:
                    - income
                    - expense
                amount_cents:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 45
                description:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'Amet iste laborum eius est dolor dolores.'
                category_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the categories table.'
                  example: null
                  nullable: true
                frequency:
                  type: string
                  description: ''
                  example: yearly
                  enum:
                    - daily
                    - weekly
                    - monthly
                    - yearly
                interval_value:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 365.'
                  example: 4
                start_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>today</code>.'
                  example: '2107-07-31'
                end_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after <code>start_date</code>.'
                  example: '2107-07-31'
                  nullable: true
              required:
                - type
                - amount_cents
                - description
                - frequency
                - start_date
      security: []
  '/api/v1/recurring-transactions/{id}':
    get:
      summary: ''
      operationId: getApiV1RecurringTransactionsId
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token not provided'
                properties:
                  message:
                    type: string
                    example: 'Token not provided'
      tags:
        - API
      security: []
    put:
      summary: ''
      operationId: putApiV1RecurringTransactionsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - API
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: ''
                  example: expense
                  enum:
                    - income
                    - expense
                amount_cents:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 45
                description:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'Amet iste laborum eius est dolor dolores.'
                category_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the categories table.'
                  example: null
                  nullable: true
                frequency:
                  type: string
                  description: ''
                  example: yearly
                  enum:
                    - daily
                    - weekly
                    - monthly
                    - yearly
                interval_value:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 365.'
                  example: 4
                start_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-07-02T03:53:44'
                end_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after <code>start_date</code>.'
                  example: '2107-07-31'
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: active
                  enum:
                    - active
                    - paused
                    - cancelled
      security: []
